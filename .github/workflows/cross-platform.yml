name: Cross-platform checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack pnpm install --frozen-lockfile --config.auto-install-peers=false --ignore-scripts
      - run: npm run check
      - run: npm run check:public
      - run: npm pack --dry-run --json
